<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="TaskVoice - Selección de perfil" />

  <title>AB TaskVoice | Seleccionar perfil</title>

  <link rel="icon" href="img/icon-512.png" sizes="any" />

  <link rel="stylesheet" href="./css/base.css" />

  <link rel="stylesheet" href="./css/login.css?v=20260827-01" />

  <link rel="stylesheet" href="./css/profile-selector.css?v=20260827-01" />

</head>

<body class="login-page profile-selector-page">

  <main class="login-container profile-selector-container">

    <section class="login-card profile-selector-card" aria-labelledby="profileSelectorTitle">

      <header class="profile-selector-header">

        <div class="profile-selector-brand">

          <img class="profile-selector-logo" src="/img/icon-512.png" alt="" width="84" height="84" />

          <div>

            <p class="profile-selector-eyebrow">AB TaskVoice</p>

            <h1 id="profileSelectorTitle">Elegí cómo ingresar</h1>

          </div>

        </div>

        <p class="profile-selector-greeting">
          Hola, <strong id="profileUserName">...</strong>. Tu cuenta tiene más de un perfil habilitado.
        </p>

      </header>

      <div id="profileSelectorLoading" class="profile-selector-loading" aria-live="polite">
        Cargando perfiles...
      </div>

      <div id="profileSelectorContent" class="hidden">

        <div id="profileOptions" class="profile-options" role="group" aria-label="Perfiles disponibles"></div>

        <div class="profile-selector-actions">

          <button type="button" id="profileLogoutButton" class="profile-logout-button">
            Cerrar sesión
          </button>

        </div>

      </div>

      <footer class="profile-selector-footer">

        Seleccioná el perfil correspondiente a la tarea que vas a realizar.

      </footer>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script type="module" src="./js/pages/profile-selector-v1.js"></script>

</body>

</html>
