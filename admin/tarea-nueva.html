<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AB TaskVoice | Nueva tarea</title>

    <link rel="icon" href="../img/icon-512.png" sizes="any">

    <link rel="stylesheet" href="../css/base.css" />

    <link rel="stylesheet" href="../css/admin.css" />

    <link rel="stylesheet" href="../css/tasks.css" />

</head>

<body class="admin-body">

    <aside id="adminSidebar"></aside>

    <div class="admin-main">

        <header id="adminTopbar"></header>

        <main class="dashboard-content">

            <div class="form-page form-page-embedded">

                <div class="form-page-header">

                    <a href="./tareas.html" class="back-link"> ← Volver a tareas </a>

                </div>

                <form id="taskForm" class="task-form-card">
                    <!-- === TÍTULO === -->

                    <div class="form-group">

                        <label for="titulo">
                            Título *
                        </label>

                        <input id="titulo" type="text" maxlength="150" autocomplete="off" required>

                    </div>

                    <!-- === DESCRIPCIÓN === -->

                    <div class="form-group">

                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea id="descripcion" rows="6"></textarea>

                    </div>

                    <!-- === LUGAR / TURNO === -->

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="lugar">
                                Lugar
                            </label>

                            <select id="lugar">

                                <option value="">
                                    Seleccionar lugar...
                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="turno">
                                Turno
                            </label>

                            <select id="turno">

                                <option value="">
                                    Seleccionar turno...
                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- === TICKET / TIPO MANTENIMIENTO === -->

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="ticketNumber">
                                N° Ticket
                            </label>

                            <input id="ticketNumber" type="text" maxlength="100" autocomplete="off"
                                placeholder="Ej.: INC-12345">

                        </div>

                        <div class="form-group">

                            <label for="maintenanceType">
                                Tipo de mantenimiento
                            </label>

                            <select id="maintenanceType">

                                <option value="">
                                    Seleccionar tipo...
                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- === TÉCNICOS === -->

                    <fieldset class="technicians-fieldset">

                        <legend>
                            Técnicos asignados *
                        </legend>

                        <p class="technicians-help">
                            Seleccioná uno o más técnicos para realizar esta tarea.
                        </p>

                        <div id="techniciansList" class="technicians-list">

                            <div class="technicians-loading">
                                Cargando técnicos...
                            </div>

                        </div>

                        <div id="techniciansSummary" class="technicians-summary" aria-live="polite">
                            Ningún técnico seleccionado
                        </div>

                    </fieldset>

                    <!-- === PRIORIDAD / FECHA === -->

                    <div class="form-grid task-secondary-fields">

                        <div class="form-group">

                            <label for="prioridad">
                                Prioridad
                            </label>

                            <select id="prioridad">

                                <option value="baja">
                                    Baja
                                </option>

                                <option value="normal" selected>
                                    Normal
                                </option>

                                <option value="alta">
                                    Alta
                                </option>

                                <option value="urgente">
                                    Urgente
                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="fechaLimite">
                                Fecha límite
                            </label>

                            <input id="fechaLimite" type="date">

                        </div>

                    </div>

                    <!-- === HORA === -->

                    <div class="form-grid task-time-grid">

                        <div class="form-group">

                            <label for="horaLimite">
                                Hora límite
                            </label>

                            <input id="horaLimite" type="time">

                        </div>

                    </div>

                    <!-- === MENSAJE === -->

                    <div id="formMessage" class="form-message" aria-live="polite"></div>

                    <!-- === ACCIONES === -->

                    <div class="form-actions">

                        <a href="./tareas.html" class="secondary-button link-button">
                            Cancelar
                        </a>

                        <button id="saveButton" type="submit" class="new-task-button">
                            Crear tarea
                        </button>

                    </div>
                </form>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

            <script type="module" src="../js/pages/admin-task-form-v2.js"></script>
</body>

</html>
