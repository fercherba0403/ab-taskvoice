<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AB TaskVoice | Nuevo usuario</title>
    <link rel="icon" href="../img/icon-512.png" sizes="any">

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/users-v2.css" />
</head>

<body class="admin-body">

    <aside id="adminSidebar"></aside>

    <div class="admin-main">

        <header id="adminTopbar"></header>

        <main class="dashboard-content">

            <div class="users-form-page">

                <a class="users-back-link" href="./usuarios.html">
                    ← Volver a usuarios
                </a>


                <section class="users-form-card">

                    <div class="users-form-header">
                        <h2>Datos del usuario</h2>

                        <p>
                            La cuenta quedará activa. La contraseña inicial será temporal y deberá cambiarla en su primer ingreso.
                        </p>
                    </div>


                    <form id="createUserForm">

                        <div class="users-form-grid">

                            <div class="users-field">
                                <label for="nombre">Nombre</label>

                                <input
                                    id="nombre"
                                    type="text"
                                    maxlength="100"
                                    required
                                    autocomplete="given-name"
                                />
                            </div>

                            <div class="users-field">
                                <label for="apellido">Apellido</label>

                                <input
                                    id="apellido"
                                    type="text"
                                    maxlength="100"
                                    required
                                    autocomplete="family-name"
                                />
                            </div>

                            <div class="users-field">
                                <label for="email">Correo electrónico</label>

                                <input
                                    id="email"
                                    type="email"
                                    maxlength="200"
                                    required
                                    autocomplete="email"
                                />
                            </div>

                            <div class="users-field">
                                <label for="telefono">
                                    Teléfono <span>opcional</span>
                                </label>

                                <input
                                    id="telefono"
                                    type="tel"
                                    maxlength="50"
                                    autocomplete="tel"
                                />
                            </div>

                            <div class="users-field">
                                <label for="profileType">Perfil habilitado</label>

                                <select id="profileType" required>
                                    <option value="tecnico">Técnico</option>
                                    <option value="jefatura">Jefatura</option>
                                    <option value="jefatura_tecnico">Jefatura + Técnico</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>

                        </div>


                        <div class="users-password-section">

                            <h3>Contraseña temporal</h3>

                            <p>
                                Debe tener al menos 10 caracteres. El usuario deberá reemplazarla en su primer ingreso.
                            </p>


                            <div class="users-form-grid">

                                <div class="users-field">
                                    <label for="password">Contraseña</label>

                                    <input
                                        id="password"
                                        type="password"
                                        minlength="10"
                                        required
                                        autocomplete="new-password"
                                    />
                                </div>

                                <div class="users-field">
                                    <label for="passwordConfirm">
                                        Repetir contraseña
                                    </label>

                                    <input
                                        id="passwordConfirm"
                                        type="password"
                                        minlength="10"
                                        required
                                        autocomplete="new-password"
                                    />
                                </div>

                            </div>

                        </div>


                        <div
                            id="createUserMessage"
                            class="users-form-message"
                            aria-live="polite"
                        ></div>


                        <div class="users-form-actions">

                            <a
                                class="users-secondary-button users-link-button"
                                href="./usuarios.html"
                            >
                                Cancelar
                            </a>

                            <button
                                id="createUserButton"
                                class="users-primary-button"
                                type="submit"
                            >
                                Crear usuario
                            </button>

                        </div>

                    </form>

                </section>

            </div>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
        type="module"
        src="../js/pages/admin-user-create-v2.js"
    ></script>

</body>
</html>
