name: Deploy TaskVoice to Cloudflare Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar sitio web
        run: |

          rm -rf _site

          mkdir -p _site

          cp index.html _site/
          cp cambiar-contrasena.html _site/
          cp seleccionar-perfil.html _site/
          cp manifest.json _site/

          cp -R admin _site/
          cp -R css _site/
          cp -R img _site/
          cp -R js _site/
          cp -R trabajador _site/

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3

        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          command: pages deploy _site --project-name=reporteaubasa --branch=main

          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
